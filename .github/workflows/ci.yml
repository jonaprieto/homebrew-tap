name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: brew tap jonaprieto/tap "$PWD"
      - name: Audit every formula and cask
        run: brew audit --strict --tap jonaprieto/tap
      - name: Style of the formulas
        run: brew style Formula
